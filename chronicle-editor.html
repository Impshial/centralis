<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/svg+xml" href="assets/centralis-icon.svg">
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">

  <link rel="stylesheet" href="styles.css?v=action-sizing-1">
  <script type="module" src="https://unpkg.com/@phosphor-icons/webcomponents@2.1"></script>
</head>
<body data-auth-required="true" data-page="chronicle-editor">
  <div class="app-shell">
    <header class="site-header" aria-label="Centralis main header">
      <a class="brand" href="index.html" aria-label="Centralis home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <rect x="5" y="5" width="14" height="14" rx="2"></rect>
            <path d="M9 5v14"></path>
            <path d="M5 10h14"></path>
          </svg>
        </span>
        <span>Centralis</span>
      </a>

      <nav class="category-nav" aria-label="Primary categories">
        <div class="menu-wrap">
          <button class="category-button menu-trigger" type="button" aria-expanded="false" aria-haspopup="menu" aria-label="World building">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3.6 9h16.8"></path>
              <path d="M3.6 15h16.8"></path>
              <path d="M12 3a15 15 0 0 1 0 18"></path>
              <path d="M12 3a15 15 0 0 0 0 18"></path>
            </svg>
            <span>World Building</span>
          </button>
          <div class="dropdown-menu" role="menu">
            <a href="universe-builder.html" role="menuitem">Universe Builder</a>
            <a href="stellar-architect.html#systems" role="menuitem">Stellar Architect</a>
            <a href="chronicle.html" role="menuitem">Chronicle</a>
          </div>
        </div>

        <div class="menu-wrap">
          <button class="category-button menu-trigger" type="button" aria-expanded="false" aria-haspopup="menu" aria-label="Entertainment">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="6" width="16" height="12" rx="2"></rect>
              <path d="M8 21h8"></path>
              <path d="M12 18v3"></path>
              <path d="m10 10 5 2-5 2z"></path>
            </svg>
            <span>Entertainment</span>
          </button>
          <div class="dropdown-menu" role="menu">
            <a href="movie-tracker.html" role="menuitem">Movie Tracker</a>
            <a href="chat-repository.html" role="menuitem">Chat Repository</a>
            <button type="button" role="menuitem">Episode Roulette</button>
          </div>
        </div>

        <div class="menu-wrap">
          <button class="category-button menu-trigger" type="button" aria-expanded="false" aria-haspopup="menu" aria-label="Utilities">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4l-5.1 5.1a2.1 2.1 0 0 0 3 3l5.1-5.1a4 4 0 0 0 5.4-5.4l-2.6 2.6-3-3z"></path>
            </svg>
            <span>Utilities</span>
          </button>
          <div class="dropdown-menu" role="menu">
          <a href="calendar.html" role="menuitem">Calendar</a>
          <a href="useful-things.html" role="menuitem">Useful Things</a>
          <button type="button" role="menuitem">Tool Two</button>
            <button type="button" role="menuitem">Tool Three</button>
          </div>
        </div>

        <div class="menu-wrap">
          <button class="category-button menu-trigger" type="button" aria-expanded="false" aria-haspopup="menu" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 1 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.3 7A2 2 0 1 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.6 1z"></path>
            </svg>
            <span>Settings</span>
          </button>
          <div class="dropdown-menu" role="menu">
            <button type="button" role="menuitem">Preferences</button>
            <button type="button" role="menuitem">Privacy</button>
            <button type="button" role="menuitem">Shortcuts</button>
          </div>
        </div>
      </nav>

      <div class="header-actions">
        <button class="icon-button theme-toggle" type="button" aria-label="Switch to dark mode">
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 7 7 0 1 0 20 14.5z"></path>
          </svg>
        </button>

        <div class="menu-wrap user-menu">
          <button class="icon-button user-button menu-trigger" type="button" aria-expanded="false" aria-haspopup="menu" aria-label="User profile">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21a8 8 0 0 1 16 0"></path>
            </svg>
          </button>
          <div class="dropdown-menu align-right" role="menu">
            <button type="button" role="menuitem">Profile</button>
            <button type="button" role="menuitem">Account</button>
            <button type="button" role="menuitem">Notifications</button>
            <button type="button" role="menuitem" data-sign-out>Sign Out</button>
          </div>
        </div>
      </div>
    </header>

    <main class="chronicle-page chronicle-editor-page" aria-label="Chronicle editor">
      <section class="chronicle-editor-shell" data-chronicle-workspace></section>
      <p class="chronicle-status" data-chronicle-status>Loading Chronicle editor...</p>
    </main>
  </div>

  <div class="modal-backdrop chronicle-text-editor-backdrop" id="chronicle-text-editor-modal" data-strict-modal hidden>
    <section class="modal-dialog chronicle-text-editor-dialog" role="dialog" aria-modal="true" aria-labelledby="chronicle-text-editor-title">
      <div class="modal-header">
        <div>
          <h2 id="chronicle-text-editor-title">Edit Text</h2>
          <p class="modal-subtitle" data-chronicle-text-editor-subtitle>Use Normal or Markdown mode.</p>
        </div>
        <button class="modal-close" type="button" data-chronicle-text-editor-close aria-label="Close text editor">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>
      <div class="chronicle-text-editor-surface" data-chronicle-text-editor-host></div>
      <textarea class="chronicle-text-editor-fallback" data-chronicle-text-editor-fallback rows="16" hidden></textarea>
      <div class="modal-actions">
        <button class="secondary-action" type="button" data-chronicle-text-editor-cancel>Cancel</button>
        <button class="primary-action" type="button" data-chronicle-text-editor-apply>Apply</button>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="chronicle-generate-image-modal" data-strict-modal hidden>
    <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="chronicle-generate-image-title">
      <div class="modal-header">
        <div>
          <h2 id="chronicle-generate-image-title">Generate Image</h2>
          <p class="modal-subtitle" data-chronicle-generate-image-subtitle>Describe the image you want to generate.</p>
        </div>
        <button class="modal-close" type="button" aria-label="Close dialog" data-chronicle-generate-image-close>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>

      <form class="element-form" data-chronicle-generate-image-form>
        <label class="form-field">
          <span>Prompt</span>
          <textarea name="chronicle-image-prompt" data-chronicle-generate-image-prompt placeholder="Add extra visual direction..."></textarea>
        </label>
        <p class="form-status" data-chronicle-generate-image-status role="status"></p>
        <div class="modal-actions">
          <button class="secondary-action" type="button" data-chronicle-generate-image-cancel>Cancel</button>
          <button class="primary-action" type="submit" data-chronicle-generate-image-submit>
            <ph-sparkle weight="bold" aria-hidden="true"></ph-sparkle>
            Generate
          </button>
        </div>
      </form>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js?v=centralis-header-1"></script>
  <script src="chronicle.js?v=chronicle-header-layout-1"></script>
</body>
</html>
