<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo | Centralis</title>
  <link rel="icon" type="image/svg+xml" href="assets/centralis-icon.svg">
  <script src="theme-bootstrap.js?v=theme-bootstrap-1"></script>
  <link rel="stylesheet" href="styles.css?v=generation-activity-1">
  <link rel="stylesheet" href="tailwind.generated.css?v=generation-activity-1">
  <script type="module" src="assets/vendor/phosphor/index.mjs?v=flat-runtime-1"></script>
</head>
<body data-auth-required="true" data-page="todo">
  <div class="app-shell">
    <header class="site-header" aria-label="Centralis main header"></header>

    <main class="todo-page" aria-labelledby="todo-title">
      <section class="todo-toolbar">
        <div>
          <p class="todo-eyebrow">Utilities</p>
          <h1 id="todo-title">ToDo</h1>
        </div>
        <div class="todo-toolbar-actions">
          <button class="primary-action" type="button" data-todo-new>
            <ph-plus weight="bold" aria-hidden="true"></ph-plus>
            New Task
          </button>
        </div>
      </section>

      <section class="todo-controls" aria-label="ToDo filters">
        <p class="todo-summary" data-todo-summary>Loading tasks...</p>
        <div class="todo-control-actions">
          <label class="todo-search">
            <ph-magnifying-glass weight="bold" aria-hidden="true"></ph-magnifying-glass>
            <input type="search" placeholder="Search tasks..." autocomplete="off" data-todo-search>
          </label>
          <label class="todo-checkbox-control">
            <input type="checkbox" data-todo-hide-completed checked>
            <span>Hide completed</span>
          </label>
          <select data-todo-status-filter aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="todo">To Do</option>
            <option value="in_progress">In Progress</option>
            <option value="completed">Completed</option>
          </select>
          <select data-todo-priority-filter aria-label="Filter by priority">
            <option value="">All priorities</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
          <select data-todo-category-filter aria-label="Filter by category">
            <option value="">All categories</option>
          </select>
        </div>
      </section>

      <p class="todo-status" data-todo-status role="status"></p>
      <section class="todo-list" data-todo-list aria-label="Tasks">
        <p class="empty-state">Loading tasks...</p>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="todo-task-modal" hidden>
    <section class="modal-dialog todo-dialog" role="dialog" aria-modal="true" aria-labelledby="todo-modal-title">
      <div class="modal-header">
        <div>
          <h2 id="todo-modal-title" data-todo-modal-title>New Task</h2>
          <p class="modal-subtitle" data-todo-modal-subtitle>Create a task and optional subtasks.</p>
        </div>
        <button class="modal-close" type="button" aria-label="Close dialog" data-todo-close>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>

      <form class="todo-form" id="todo-task-form" data-todo-form>
        <input type="hidden" name="task-id" data-todo-task-id>
        <label class="form-field">
          <span>Title *</span>
          <input type="text" name="title" required maxlength="240" autocomplete="off">
        </label>

        <label class="form-field">
          <span>Description</span>
          <textarea name="description" rows="4"></textarea>
        </label>

        <div class="todo-form-grid">
          <label class="form-field">
            <span>Status</span>
            <select name="status">
              <option value="">Pending / unset</option>
              <option value="todo">To Do</option>
              <option value="in_progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </label>
          <label class="form-field">
            <span>Priority</span>
            <select name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </label>
          <label class="form-field">
            <span>Due Date</span>
            <input type="date" name="due_date">
          </label>
          <label class="form-field">
            <span>Category</span>
            <input type="text" name="category" list="todo-category-options" maxlength="120" placeholder="e.g., Work, Personal" autocomplete="off">
            <datalist id="todo-category-options" data-todo-category-options></datalist>
          </label>
        </div>

        <section class="todo-subtask-editor" aria-label="Subtasks">
          <div class="todo-subtask-header">
            <h3>Subtasks</h3>
            <span data-todo-subtask-count>0 subtasks</span>
          </div>
          <div class="todo-subtask-add">
            <input type="text" placeholder="Add subtask..." data-todo-subtask-title>
            <label class="todo-required-toggle">
              <input type="checkbox" data-todo-subtask-required>
              Required
            </label>
            <button class="icon-button todo-subtask-add-button" type="button" data-todo-add-subtask aria-label="Add subtask">
              <ph-plus weight="bold" aria-hidden="true"></ph-plus>
            </button>
          </div>
          <div class="todo-subtask-list" data-todo-subtask-list></div>
        </section>

        <p class="form-status" data-todo-form-status role="status"></p>
      </form>

      <div class="modal-actions todo-modal-actions">
        <button class="danger-action" type="button" data-todo-delete hidden>
          <ph-trash weight="bold" aria-hidden="true"></ph-trash>
          Delete
        </button>
        <span></span>
        <button class="secondary-action" type="button" data-todo-close>Cancel</button>
        <button class="primary-action" type="submit" form="todo-task-form" data-todo-save>Save Task</button>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js?v=roleplayer-1"></script>
  <script src="todo.js?v=todo-v7"></script>
</body>
</html>
